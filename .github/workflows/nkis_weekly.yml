name: NKIS 주간 데이터 수집

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: NKIS 데이터 수집
        env:
          NKIS_API_KEY: ${{ secrets.NKIS_API_KEY }}
        run: python scripts/fetch_nkis_data.py

      - name: 결과 커밋
        run: |
          git config user.email "badaegopa@naver.com"
          git config user.name "badaegopa"
          git add data/nkis_policy_timeseries.csv
          git diff --staged --quiet || git commit -m "자동수집: NKIS 정책연구 $(date '+%Y-%m-%d')"
          git push
