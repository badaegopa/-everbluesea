<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장 체감온도 현황</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=DM+Mono:wght@500&display=swap');
  :root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e8eaf0;--muted:#6b7080;--safe:#22c55e;--caution:#f59e0b;--warning:#ef4444;--stop:#7c3aed;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px;}
  header{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .logo{font-size:13px;color:var(--muted);}
  .company-bar{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .company-name{font-size:15px;font-weight:700;color:var(--text);}
  .manager-name{font-size:12px;color:var(--muted);}
  .updated{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:20px;}
  .main-card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px 28px 28px;margin-bottom:16px;position:relative;overflow:hidden;transition:border-color 0.4s;}
  .main-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--level-color,var(--safe));border-radius:20px 20px 0 0;transition:background 0.4s;}
  .level-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:5px 14px;border-radius:20px;margin-bottom:20px;background:color-mix(in srgb,var(--level-color,var(--safe)) 15%,transparent);color:var(--level-color,var(--safe));border:1px solid color-mix(in srgb,var(--level-color,var(--safe)) 30%,transparent);transition:all 0.4s;}
  .level-dot{width:7px;height:7px;border-radius:50%;background:var(--level-color,var(--safe));animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.8)}}
  .temp-display{display:flex;align-items:flex-start;gap:4px;margin-bottom:8px;}
  .temp-number{font-family:'DM Mono',monospace;font-size:86px;font-weight:500;line-height:1;color:var(--level-color,var(--safe));transition:color 0.4s;}
  .temp-unit{font-family:'DM Mono',monospace;font-size:32px;font-weight:500;color:var(--level-color,var(--safe));margin-top:12px;transition:color 0.4s;}
  .temp-label{font-size:14px;color:var(--muted);margin-bottom:24px;}
  .meta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .meta-item{background:#12151e;border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .meta-label{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .meta-value{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);}
  .meta-unit{font-size:12px;color:var(--muted);margin-left:2px;}
  .guide-card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px 28px;margin-bottom:16px;}
  .guide-title{font-size:12px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:16px;}
  .guide-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .guide-row:last-child{border-bottom:none;}
  .guide-row.active{background:color-mix(in srgb,var(--level-color,var(--safe)) 8%,transparent);margin:0 -12px;padding:10px 12px;border-radius:10px;border-bottom:none;}
  .guide-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .guide-range{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);min-width:80px;}
  .guide-name{font-size:14px;font-weight:700;flex:1;}
  .guide-action{font-size:12px;color:var(--muted);text-align:right;}
  .action-card{width:100%;max-width:480px;border:1px solid color-mix(in srgb,var(--level-color,var(--safe)) 40%,transparent);background:color-mix(in srgb,var(--level-color,var(--safe)) 6%,var(--card));border-radius:20px;padding:24px 28px;margin-bottom:16px;transition:all 0.4s;}
  .action-title{font-size:13px;font-weight:700;color:var(--level-color,var(--safe));margin-bottom:14px;}
  .action-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .action-list li{font-size:14px;color:var(--text);padding-left:16px;position:relative;line-height:1.5;}
  .action-list li::before{content:'▸';position:absolute;left:0;color:var(--level-color,var(--safe));font-size:11px;top:2px;}
  .loading{font-size:14px;color:var(--muted);text-align:center;padding:40px 0;}
  footer{width:100%;max-width:480px;text-align:center;font-size:11px;color:var(--muted);margin-top:8px;line-height:1.8;}
</style>
</head>
<body>
<header>
  <span class="logo">혹서기 안전관리 시스템</span>
  <span class="updated" id="updated-time">--:-- 갱신</span>
</header>

<div class="company-bar">
  <span class="company-name">🏢 성진SJMASTER</span>
  <span class="manager-name">담당자 : 김기섭</span>
</div>

<div id="loading" class="loading">데이터 불러오는 중...</div>

<div id="main-card" class="main-card" style="display:none">
  <div class="level-badge"><span class="level-dot"></span><span id="level-text">--</span></div>
  <div class="temp-display">
    <span class="temp-number" id="temp-val">--</span>
    <span class="temp-unit">°C</span>
  </div>
  <div class="temp-label">체감온도 (현재 측정값)</div>
  <div class="meta-row">
    <div class="meta-item"><div class="meta-label">실제 기온</div><div class="meta-value"><span id="real-temp">--</span><span class="meta-unit">°C</span></div></div>
    <div class="meta-item"><div class="meta-label">습도</div><div class="meta-value"><span id="humidity">--</span><span class="meta-unit">%</span></div></div>
    <div class="meta-item"><div class="meta-label">측정 시각</div><div class="meta-value" style="font-size:16px" id="measure-time">--:--</div></div>
    <div class="meta-item"><div class="meta-label">작업 구역</div><div class="meta-value" style="font-size:15px" id="zone-name">--</div></div>
  </div>
</div>

<div class="guide-card" id="guide-card" style="display:none">
  <div class="guide-title">경보 단계 기준</div>
  <div class="guide-row" id="row-safe"><div class="guide-dot" style="background:var(--safe)"></div><div class="guide-range">~ 31°C</div><div class="guide-name" style="color:var(--safe)">정상</div><div class="guide-action">일반 작업</div></div>
  <div class="guide-row" id="row-caution"><div class="guide-dot" style="background:var(--caution)"></div><div class="guide-range">31 ~ 33°C</div><div class="guide-name" style="color:var(--caution)">주의</div><div class="guide-action">수분 보충 강화</div></div>
  <div class="guide-row" id="row-warning"><div class="guide-dot" style="background:var(--warning)"></div><div class="guide-range">33 ~ 35°C</div><div class="guide-name" style="color:var(--warning)">경보</div><div class="guide-action">작업 단축·휴식</div></div>
  <div class="guide-row" id="row-stop"><div class="guide-dot" style="background:var(--stop)"></div><div class="guide-range">35°C ~</div><div class="guide-name" style="color:var(--stop)">작업중지</div><div class="guide-action">즉시 대피</div></div>
</div>

<div class="action-card" id="action-card" style="display:none">
  <div class="action-title" id="action-title"></div>
  <ul class="action-list" id="action-list"></ul>
</div>

<footer>본 페이지는 원청 안전담당자가 직접 측정·입력한 데이터입니다.<br>의문 사항은 현장 안전담당자에게 문의하세요.</footer>

<script>
const SHEET_ID='1039VJe3GWFmUHCccCZMap471dT_i94C4YWi1B8I0YUw';
const URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

const ACTIONS={
  safe:{color:'var(--safe)',label:'정상',title:'✓ 현재 정상 작업 가능',items:['정상적인 작업을 진행합니다.','매 시간 수분(물 또는 이온음료) 보충을 권장합니다.','이상 증상 발생 시 즉시 담당자에게 보고하세요.']},
  caution:{color:'var(--caution)',label:'주의',title:'⚠ 주의 단계 — 수분 보충 강화',items:['30분마다 수분 보충(200ml 이상)을 실시합니다.','직사광선 노출을 최소화합니다.','어지러움·두통·구역질 증상 발생 시 즉시 그늘로 이동하세요.','2인 1조 작업을 권장합니다.']},
  warning:{color:'var(--warning)',label:'경보',title:'🔴 경보 단계 — 작업 단축 및 휴식 강화',items:['옥외 작업시간을 시간당 45분 이하로 단축합니다.','15분 이상 그늘 또는 냉방 공간에서 휴식합니다.','고령자·기저질환자는 옥외 작업을 중단합니다.','작업자 상태를 수시로 확인합니다.','폭염 환자 발생 즉시 119 신고 및 담당자 보고.']},
  stop:{color:'var(--stop)',label:'작업중지',title:'🚫 작업중지 — 즉시 대피',items:['모든 옥외 작업을 즉시 중단합니다.','작업자 전원 냉방 장소로 대피합니다.','재개 여부는 원청 안전담당자 지시에 따릅니다.','폭염 환자 발생 시 즉시 119 신고하세요.','작업 재개 전 체감온도 재측정 및 확인 필수.']}
};

function getLevel(t){
  if(t>=35)return'stop';
  if(t>=33)return'warning';
  if(t>=31)return'caution';
  return'safe';
}

function render(data){
  const level=getLevel(data.feelsLike);
  const info=ACTIONS[level];
  document.documentElement.style.setProperty('--level-color',info.color);
  document.getElementById('temp-val').textContent=data.feelsLike.toFixed(1);
  document.getElementById('real-temp').textContent=data.realTemp.toFixed(1);
  document.getElementById('humidity').textContent=data.humidity;
  document.getElementById('measure-time').textContent=data.time;
  document.getElementById('zone-name').textContent=data.zone;
  document.getElementById('level-text').textContent=info.label;
  document.getElementById('updated-time').textContent=data.time+' 갱신';
  ['safe','caution','warning','stop'].forEach(l=>document.getElementById('row-'+l).classList.remove('active'));
  document.getElementById('row-'+level).classList.add('active');
  document.getElementById('action-title').textContent=info.title;
  document.getElementById('action-list').innerHTML=info.items.map(i=>`<li>${i}</li>`).join('');
  document.getElementById('loading').style.display='none';
  document.getElementById('main-card').style.display='block';
  document.getElementById('guide-card').style.display='block';
  document.getElementById('action-card').style.display='block';
}

async function load(){
  try{
    const res=await fetch(URL+'&_='+Date.now());
    const txt=await res.text();
    const rows=txt.trim().split('\n').map(r=>r.replace(/"/g,'').split(','));
    const map={};
    rows.forEach(r=>{ if(r[0])map[r[0].trim()]=r[1]?r[1].trim():''; });
    render({
      feelsLike:parseFloat(map['feelsLike'])||0,
      realTemp:parseFloat(map['realTemp'])||0,
      humidity:map['humidity']||'--',
      zone:map['zone']||'--',
      time:map['time']||'--'
    });
  }catch(e){
    document.getElementById('loading').textContent='데이터를 불러올 수 없습니다. 잠시 후 다시 시도하세요.';
  }
}

load();
setInterval(load,60000);
</script>
</body>
</html>
